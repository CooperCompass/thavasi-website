name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-thavasi-website
  cancel-in-progress: false

env:
  APP_DIR: /opt/thavasi-website

jobs:
  deploy:
    runs-on: [self-hosted, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Sync into ${{ env.APP_DIR }}
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' --exclude='**/node_modules' \
            --exclude='dist' --exclude='**/dist' \
            --exclude='.env' \
            "${GITHUB_WORKSPACE}/" "${APP_DIR}/"

      - name: Build & start containers
        run: |
          cd "${APP_DIR}"
          [ -f .env ] || cp .env.example .env
          ./deploy/deploy.sh
