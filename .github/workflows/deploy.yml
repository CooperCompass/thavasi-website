name: Deploy

# Self-hosted runner on the VPS. Full stack: nginx + API + MongoDB.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-thavasi-website
  cancel-in-progress: false

env:
  APP_DIR: /opt/thavasi-website

jobs:
  deploy:
    runs-on: [self-hosted, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Sync checkout into ${{ env.APP_DIR }}
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' --exclude='**/node_modules' \
            --exclude='dist' --exclude='**/dist' \
            --exclude='deploy/.env' \
            "${GITHUB_WORKSPACE}/" "${APP_DIR}/"

      - name: Deploy stack
        run: |
          cd "${APP_DIR}/deploy"
          [ -f .env ] || cp .env.example .env
          ./deploy.sh
