name: thavasi-website

networks:
  thavasi-net:
    name: thavasi-net

services:
  web:
    build:
      context: .
      args:
        VITE_API_URL: same-origin
    image: thavasi-website:latest
    container_name: thavasi-website
    restart: unless-stopped
    expose:
      - '3001'
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: thavasi_landing
      LANDING_URL: ${LANDING_URL:-https://thavasi.coopercompass.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-system@coopercompass.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SECRET: ${ADMIN_SECRET:-thavasi-landing-admin-secret}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - thavasi-net

  mongo:
    image: mongo:7
    container_name: thavasi-website-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - thavasi-net

  caddy:
    image: caddy:2
    container_name: thavasi-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - thavasi-net

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
