name: thavasi-website

networks:
  thavasi-net:
    name: thavasi-net

services:
  web:
    build:
      context: .
      args:
        VITE_API_URL: same-origin
    image: thavasi-website:latest
    container_name: thavasi-website
    restart: unless-stopped
    expose:
      - '3001'
    environment:
      PORT: 3001
      LANDING_URL: ${LANDING_URL:-https://thavasi.coopercompass.com}
      # Early-access enquiries are owned by Thavasi Scrutiny (PostgreSQL) and reviewed
      # in its admin UI. Reached by container name over the shared network; its nginx
      # proxies /api to the FastAPI backend.
      SCRUTINY_API_URL: ${SCRUTINY_API_URL:-http://thavasi-scrutiny-web/api/v1}
    networks:
      - thavasi-net


  caddy:
    image: caddy:2
    container_name: thavasi-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - thavasi-net

volumes:
  caddy_data:
  caddy_config:
